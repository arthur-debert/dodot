[package]
name = "dodot-lib"
version = "5.9.0"
edition = "2021"
license = "MIT"
description = "Core library for dodot dotfiles manager"
repository = "https://github.com/arthur-debert/dodot"

[dependencies]
burgertocow-lib = "0.4"
clapfig = "0.16"
confique = "0.4"
diffy = "0.4"
flate2 = "1"
glob = "0.3"
# Two Unix facts std does not expose: killing a process group (the
# shell-hookup probe's timeout, `shell::probe`) and the login shell in
# the user database (`shell::rc`).
libc = "0.2"
minijinja = "2"
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
standout-render = "7.3"
tar = "0.4"
# The scratch directory the hook-line trace's fallback copy runs from
# (`shell::trace`): exclusive creation under an unpredictable name,
# 0700 at creation, removed on drop. Production code, not just tests.
# 3.9 for `Builder::permissions`, which is how the trace's scratch
# directory gets mode 0700 from `mkdir` itself rather than a
# follow-up `chmod` (see `shell::trace::scratch_dir`). A bare "3"
# resolves fine today and would break on any older 3.x.
tempfile = "3.9"
thiserror = "2"
# Relative time ("4 minutes ago") for the shell-hookup footer. Default
# features off: the formatter takes a `std::time::Duration`, so no
# date-time crate enters the tree.
timeago = { version = "0.6.1", default-features = false }
toml = "0.8"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
test-utils = []
