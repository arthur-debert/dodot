name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  # GitHub validates reusable-workflow permissions at load time, including
  # jobs gated by `if:`.
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: arthur-debert/release/.github/workflows/mkdocs.yml@v3
    with:
      requirements: docs/requirements.txt
